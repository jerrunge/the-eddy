<style>

  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<body>
<header><div class="wrap">

<script>
const FN = "https://dsjnvwhyevjzsmuawkcs.supabase.co/functions/v1";
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

let TOKEN = ""; try { TOKEN = localStorage.getItem("eddy_token") || ""; } catch(e) {}
{ const m = location.search.match(/[?&]t=([^&]+)/); if (m) { TOKEN = decodeURIComponent(m[1]); try{ localStorage.setItem("eddy_token", TOKEN); }catch(e){} history.replaceState(null,"",location.pathname); } }
document.getElementById("pair-btn").onclick = () => { const v = document.getElementById("pair-input").value.trim(); const m = v.match(/[?&]t=([^&]+)/); TOKEN = m ? decodeURIComponent(m[1]) : v; try{ localStorage.setItem("eddy_token", TOKEN); }catch(e){} load(); };

async function api(op, extra={}, fn="face-api") {
  const r = await fetch(FN+"/"+fn, { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ token: TOKEN, op, ...extra }) });
  const d = await r.json().catch(()=>({error:"bad response"}));
  if (!r.ok || d.error) throw new Error(d.error || ("HTTP "+r.status));
  return d;
}
function toast(msg, ms=1800){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
const E = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n, d=0) => n == null || isNaN(n) ? "–" : Number(n).toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
const hm = (min) => min == null ? "–" : `${Math.floor(min/60)}h ${String(Math.round(min%60)).padStart(2,"0")}m`;
const dstr = (ymd) => { if(!ymd) return ""; const [y,m,d]=String(ymd).slice(0,10).split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("en-US",{month:"short",day:"numeric"}); };
const daysTo = (ymd) => { const [y,m,d]=String(ymd).slice(0,10).split("-").map(Number); const t=new Date(); t.setHours(0,0,0,0); return Math.round((new Date(y,m-1,d)-t)/86400000); };
const tstr = (iso) => new Date(iso).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
function spark(vals, w=300, h=60, color="#F2B544", pad=4){
  const v = vals.filter(x => x != null && !isNaN(x)); if (v.length < 2) return "";
  const min = Math.min(...v), max = Math.max(...v), span = (max-min) || 1;
  const pts = v.map((x,i) => [pad + i*(w-2*pad)/(v.length-1), h-pad - (x-min)/span*(h-2*pad)]);
  const d = pts.map((p,i) => (i?"L":"M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const last = pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.2" fill="${color}"/></svg>`;
}
const avg = (a) => { const v=a.filter(x=>x!=null&&!isNaN(x)); return v.length? v.reduce((s,x)=>s+x,0)/v.length : null; };
function arrow(recent, prior, goodWhenUp=true){ if (recent==null||prior==null) return ""; const d = recent-prior; const pct = prior? d/prior : 0; if (Math.abs(pct) < 0.02) return `<span class="flat">→ same</span>`; const up = d>0; const cls = (up===goodWhenUp) ? "up" : "down"; return `<span class="${cls}">${up?"↑":"↓"} ${fmt(Math.abs(d), Math.abs(d)<10?1:0)} vs prior 7</span>`; }

let B = null;
const BLOCKS = [["Wake",["wake","levo_gap_closed"]],["Midday",["meal_start","fork_down","dip_clear","gym_leave"]],["Evening",["wind_down","lights_down"]],["Close",["close"]]];
const ANCHOR_NAMES = {wake:"first thing", levo_gap_closed:"after the levo gap", meal_start:"with lunch", fork_down:"after lunch", dip_clear:"mid afternoon", gym_leave:"after the gym", wind_down:"evening", lights_down:"lights down", close:"the close"};
const TIMING = {on_waking:"On waking", with_breakfast:"With breakfast", pre_gym:"Before the gym", bedtime:"Bedtime", weekly:"Thursday"};
const CAD_DAYS = {daily:1, weekly:7, biweekly:14, monthly:30, quarterly:90, yearly:365};

async function load(){
  if (!TOKEN) { document.getElementById("pair").style.display="block"; return; }
  try { B = await api("board"); } catch(e) { if (/token/.test(e.message)) { TOKEN=""; document.getElementById("pair").style.display="block"; return; } toast("Could not reach the board: "+e.message, 3000); return; }
  document.getElementById("pair").style.display="none"; document.getElementById("app").style.display="block";
  render();
}
function render(){
  const [y,m,d] = B.today.split("-").map(Number); const td = new Date(y,m-1,d);
  document.getElementById("date").textContent = td.toLocaleDateString("en-US",{weekday:"long", month:"long", day:"numeric"});
  const h = new Date().getHours(); document.getElementById("hello").textContent = h<12?"Morning, Dad.":h<17?"Afternoon, Dad.":"Evening, Dad.";
  renderNumbers(); renderNext(); renderToday(); renderBody(); renderWork(); renderPeople(); renderVentures(); renderDates(); renderGoals();
  document.getElementById("foot").innerHTML = `Everything here is yours. No caps, no gates, nothing hidden. Served ${tstr(B.served_at)}.`;
  handToNative();
}
// the native shell (29:11 on iPhone, iPad, Mac) listens here: the widget, the wrist, and the local knocks read this and nothing else
function handToNative(){
  try {
    const h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.face; if (!h) return;
    const arc = weightArc(); const done = new Set(B.completions.map(c=>c.template_id)); const active = B.routines.filter(r=>!r.paused);
    const nextEl = document.querySelectorAll("#next .row .t b"); const next = [...nextEl].slice(0,3).map(b=>b.textContent);
    h.postMessage(JSON.stringify({
      date: B.today,
      offHigh: arc ? Number(arc.off.toFixed(1)) : null, latestLb: arc ? arc.last.lb : null, highLb: arc ? arc.hi.lb : null,
      routineLeft: active.filter(r=>!done.has(r.id)).length, routineTotal: active.length,

    }));
  } catch(e) {}
}

// ---------- NUMBERS ----------
function weightArc(){ const W=B.weights; if(!W.length) return null; const hi = W.reduce((a,b)=> b.lb>a.lb?b:a); const last = W[W.length-1]; return { hi, last, off: hi.lb-last.lb }; }
function renderNumbers(){
  const W = B.weights; const H = B.health;
  const hero = document.getElementById("hero");
  const arc = weightArc();
  if (arc){
    const {hi,last,off} = arc; const goal = 60; const pct = Math.max(0, Math.min(100, off/goal*100));
    const last7 = W.filter(w => daysTo(w.date) >= -7).map(w=>w.lb); const prev7 = W.filter(w => daysTo(w.date) < -7 && daysTo(w.date) >= -14).map(w=>w.lb);

      <div class="sub">${fmt(hi.lb,1)} on ${dstr(hi.date)} · ${fmt(last.lb,1)} on ${dstr(last.date)}${last.fat!=null?` · ${fmt(last.fat,1)}% fat`:""}${last.lean?` · ${fmt(last.lean,1)} lb lean`:""}</div>
      <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
      <div class="sub">${fmt(pct,0)}% of the 60 · ${fmt(goal-off,1)} to go${a7!=null?` · 7-day avg ${fmt(a7,1)}`:""}${a7!=null&&p7!=null?` (${a7<p7?"down":"up"} ${fmt(Math.abs(a7-p7),1)} on the week before)`:""}</div>
      ${spark(W.map(w=>w.lb), 600, 64)}
      <div class="sub" style="display:flex;justify-content:space-between"><span>${dstr(W[0].date)}</span><span>${W.length} readings</span><span>${dstr(last.date)}</span></div>
      <div class="add"><input id="weigh-in" type="number" step="0.1" inputmode="decimal" placeholder="Weigh in by hand"><button class="btn ghost" id="weigh-btn">Log</button></div>`;
    document.getElementById("weigh-btn").onclick = async () => { const v = Number(document.getElementById("weigh-in").value); if (!v) return; try { await api("weigh", { lb: v }); B = await api("board"); render(); toast("Logged."); } catch(e){ toast("Not saved: "+e.message); } };
  } else hero.innerHTML = `<div class="k">Weight</div><div class="empty">No readings yet.</div>`;
  const full = H.filter(r => r.date !== B.today);
  const win = (arr, k) => ({ rec: avg(arr.slice(-7).map(x=>x[k])), pri: avg(arr.slice(-14,-7).map(x=>x[k])) });
  const lastWith = (k, src=H) => [...src].reverse().find(r => r[k] != null);
  const tile = (label, valHtml, key, goodUp, src=H, sparkColor="#1FA3A8") => {
    const lw = lastWith(key, src); const w = win(src, key);
    return `<div class="tile"><div class="k">${label}</div><div class="v">${valHtml}</div><div class="l"><span>${lw?dstr(lw.date):""}</span><b>${arrow(w.rec,w.pri,goodUp)}</b></div>${spark(src.slice(-14).map(x=>x[key]), 300, 26, sparkColor)}</div>`;
  };
  const s = lastWith("sleep_total_min"), hv = lastWith("hrv_sdnn_ms"), rh = lastWith("resting_hr"), vo = lastWith("vo2_max");
  const st = lastWith("steps", full), ae = lastWith("active_energy_kcal", full), ex = lastWith("exercise_minutes", full), pr = lastWith("protein_g", full), dk = lastWith("dietary_energy_kcal", full);
  const rec = full.slice(-7);
  const tiles = [
    s ? tile("Sleep", `${hm(s.sleep_total_min)}<small> deep ${Math.round(s.sleep_deep_min||0)}m · REM ${Math.round(s.sleep_rem_min||0)}m</small>`, "sleep_total_min", true) : "",
    hv ? tile("HRV", `${fmt(hv.hrv_sdnn_ms,0)}<small> ms</small>`, "hrv_sdnn_ms", true) : "",
    st ? tile("Steps", `${fmt(st.steps,0)}`, "steps", true, full) : "",
    ex ? tile("Exercise", `${fmt(ex.exercise_minutes,0)}<small> min · 7d ${fmt(rec.reduce((a,x)=>a+(x.exercise_minutes||0),0),0)}</small>`, "exercise_minutes", true, full) : "",
    ae ? tile("Active burn", `${fmt(ae.active_energy_kcal,0)}<small> kcal</small>`, "active_energy_kcal", true, full) : "",
    rh ? tile("Resting HR", `${fmt(rh.resting_hr,0)}<small> bpm</small>`, "resting_hr", false) : "",
    pr ? tile("Protein", `${fmt(pr.protein_g,0)}<small> g${dk?` · ${fmt(dk.dietary_energy_kcal,0)} kcal`:""}</small>`, "protein_g", true, full, "#F2B544") : "",
    vo ? tile("VO2 max", `${fmt(vo.vo2_max,1)}`, "vo2_max", true) : "",
  ].join("");
  document.getElementById("tiles").innerHTML = tiles || `<div class="empty">No health data in the last 45 days.</div>`;
  // the read
  const rc = document.getElementById("read-card");
  rc.innerHTML = `<div class="read"><div class="k">The read</div><div class="line" id="read-line">One line, with receipts, when you want it.</div><div class="acts" style="margin-top:10px"><button class="btn" id="read-btn">Read the day</button></div></div>`;
  document.getElementById("read-btn").onclick = readDay;
}
function facts(){
  const arc = weightArc(); const H = B.health; const last = H[H.length-1] || {}; const y = H[H.length-2] || {};
  const done = new Set(B.completions.map(c=>c.template_id)); const active = B.routines.filter(r=>!r.paused);
  const late = B.items.filter(i=>!i.done && i.due && daysTo(i.due)<0).map(i=>i.text);
  const today = B.items.filter(i=>!i.done && i.due && daysTo(i.due)===0).map(i=>i.text);
  const lin = Array.isArray(B.linear) ? B.linear : [];
  const lines = [
    arc ? `Weight: ${arc.off.toFixed(1)} lb off the high of ${arc.hi.lb} (${arc.hi.date}); latest ${arc.last.lb} on ${arc.last.date}; goal is 60 lb.` : "",
    last.date ? `Health ${last.date}: sleep ${last.sleep_total_min?Math.round(last.sleep_total_min):"?"} min, HRV ${last.hrv_sdnn_ms?Math.round(last.hrv_sdnn_ms):"?"} ms, steps ${last.steps?Math.round(last.steps):"?"}, resting HR ${last.resting_hr??"?"}.` : "",
    y.date ? `Yesterday ${y.date}: steps ${y.steps?Math.round(y.steps):"?"}, exercise ${y.exercise_minutes??"?"} min, active ${y.active_energy_kcal?Math.round(y.active_energy_kcal):"?"} kcal, protein ${y.protein_g??"?"} g, food ${y.dietary_energy_kcal??"?"} kcal.` : "",
    B.cut ? `Cut targets: ${B.cut.kcal_target} kcal, ${B.cut.protein_g_target} g protein, phase ${B.cut.phase}.` : "",
    `Routines today: ${active.filter(r=>done.has(r.id)).length} of ${active.length} done. Meds logged: ${B.med_log.length} of ${B.medications.filter(m=>m.active).length}.`,
    late.length ? `Late items: ${late.slice(0,6).join("; ")}.` : "No late items.",
    today.length ? `Due today: ${today.slice(0,6).join("; ")}.` : "",
    lin.length ? `Linear open: ${lin.length}; due soon: ${lin.filter(i=>i.due && daysTo(i.due)<=2).map(i=>i.key+" "+i.title).slice(0,5).join("; ")||"none"}.` : "",
    B.calendar.length ? `Calendar today: ${B.calendar.map(c=>c.summary).join("; ")}.` : "Calendar: nothing cached.",
    B.boxes.filter(b=>b.deadline).map(b=>`${b.title} deadline ${b.deadline} (${daysTo(b.deadline)} days)`).join("; "),
    Array.isArray(B.hevy) && B.hevy.length ? `Last training: ${B.hevy[0].title} on ${String(B.hevy[0].start).slice(0,10)}; sessions in 7 days: ${B.hevy.filter(w=>daysTo(String(w.start).slice(0,10))>=-7).length}.` : "",
    B.people.filter(p=>p.last_contacted && p.cadence && daysTo(p.last_contacted) < -(CAD_DAYS[p.cadence]||30)).slice(0,5).map(p=>`${p.name} last contacted ${p.last_contacted} (cadence ${p.cadence})`).join("; "),
  ].filter(Boolean);
  return lines.join("\n");
}
async function readDay(){
  const btn = document.getElementById("read-btn"); btn.disabled = true; btn.textContent = "Reading…";
  try { const r = await api("read", { facts: facts() }); let d = r.read;
    if (d && typeof d.line === "string" && d.line.trim().startsWith("{")) { try { d = JSON.parse(d.line.replace(/[␀-]+/g, " ")); } catch(e) {} }
    document.getElementById("read-card").innerHTML = `<div class="read"><div class="k">The read · ${tstr(new Date().toISOString())}</div><div class="line">${E(d.line)}</div>${d.number?`<div class="num">${E(d.number)}</div>`:""}<div class="ev">${(d.evidence||[]).map(e=>`<span>· ${E(e)}</span>`).join("")}</div><div class="acts" style="margin-top:10px"><button class="btn ghost" id="read-btn">Read again</button></div></div>`;
    document.getElementById("read-btn").onclick = readDay;
  } catch(e){ btn.disabled=false; btn.textContent="Read the day"; toast("No read: "+e.message, 3000); }
}
// ---------- NEXT, with receipts ----------
function renderNext(){
  const out = []; const now = new Date(); const hour = now.getHours();
  for (const i of B.items) if (!i.done && i.kind!=="note" && i.due) { const d = daysTo(i.due); if (d<=0) out.push({ w: d<0? 100 - d : 90, t: i.text, why: d<0 ? `late by ${-d} day${-d===1?"":"s"}` : "due today", src: (B.boxes.find(b=>b.id===i.box_id)||{}).title }); }
  if (Array.isArray(B.linear)) for (const i of B.linear) { const d = i.due ? daysTo(i.due) : null; if ((d!=null && d<=1) || i.priority===1) out.push({ w: d!=null&&d<0 ? 95 : d===0 ? 88 : i.priority===1 ? 80 : 70, t: `${i.key} ${i.title}`, why: d!=null ? (d<0?`late by ${-d}d`:d===0?"due today":"due tomorrow") : "urgent in Linear", src: i.project||"Linear" }); }
  for (const c of B.calendar) { const st = new Date(c.start_at); if (st > now) out.push({ w: 85, t: c.summary, why: `at ${tstr(c.start_at)}`, src: "calendar" }); }
  const done = new Set(B.completions.map(c=>c.template_id));
  const blockNow = hour<11 ? "Wake" : hour<17 ? "Midday" : hour<21 ? "Evening" : "Close";
  const anchors = (BLOCKS.find(b=>b[0]===blockNow)||[])[1] || [];
  for (const r of B.routines) if (!r.paused && !done.has(r.id) && anchors.includes(r.anchor)) out.push({ w: 60, t: r.title, why: `${blockNow.toLowerCase()} routine, ${ANCHOR_NAMES[r.anchor]||""}`, src: "today" });
  const taken = new Set(B.med_log.map(m=>m.med_name));
  const medNow = hour<10 ? ["on_waking","with_breakfast"] : hour<15 ? ["with_breakfast","pre_gym"] : hour<21 ? ["pre_gym"] : ["bedtime"];
  for (const m of B.medications) if (m.active && !taken.has(m.name) && (medNow.includes(m.timing) || (m.timing==="weekly" && now.getDay()===4))) out.push({ w: 65, t: m.name, why: TIMING[m.timing]||m.timing, src: "meds" });
  for (const p of B.people) if (p.last_contacted && p.cadence && CAD_DAYS[p.cadence]) { const over = -daysTo(p.last_contacted) - CAD_DAYS[p.cadence]; if (over > 0 && !(p.snoozed_until && daysTo(p.snoozed_until)>0)) out.push({ w: 50 + Math.min(over,20), t: p.name, why: `${over} days past your ${p.cadence} cadence`, src: "people" }); }
  out.sort((a,b)=>b.w-a.w);
  const top = out.slice(0,7);
  document.getElementById("next").innerHTML = `<h3>Next <span class="cnt">${out.length} with a reason</span></h3>` + (top.map(n=>`<div class="row"><div class="t"><b>${E(n.t)}</b><small>${E(n.why)}${n.src?` · ${E(n.src)}`:""}</small></div></div>`).join("") || `<div class="empty">Nothing is asking for you right now. Pick anything.</div>`);
}

// ---------- TODAY ----------
let FOCUS = { label: "", endsAt: null, timer: null };
function renderFocus(){
  const c = document.getElementById("focus-card");
  const left = FOCUS.endsAt ? Math.max(0, Math.round((FOCUS.endsAt - Date.now())/1000)) : null;
  const mm = left==null ? "–:––" : `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  c.innerHTML = `<div class="focus"><div class="clock">${mm}</div><div class="lab"><b>${E(FOCUS.label||"Hyperfocus")}</b><small>${FOCUS.endsAt?"One thing, until the clock says so.":"Pick a length. Tap any line to name the thing."}</small></div>
    <div class="btns"><button data-m="15">15</button><button data-m="25">25</button><button data-m="45">45</button>${FOCUS.endsAt?`<button data-m="0">Stop</button>`:""}</div></div>`;
  c.querySelectorAll("button").forEach(b => b.onclick = () => startFocus(Number(b.dataset.m)));
}
function startFocus(min){
  clearInterval(FOCUS.timer); FOCUS.timer=null;
  if (!min) { FOCUS.endsAt=null; renderFocus(); return; }
  FOCUS.endsAt = Date.now() + min*60000;
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(()=>{});
  FOCUS.timer = setInterval(() => { if (Date.now() >= FOCUS.endsAt) { clearInterval(FOCUS.timer); FOCUS.timer=null; FOCUS.endsAt=null; try{ if (Notification.permission==="granted") new Notification("29:11", { body: "Sprint done. " + (FOCUS.label||"Well done.") }); }catch(e){} toast("Sprint done."); } renderFocus(); }, 1000);
  renderFocus();
}
function renderToday(){
  renderFocus();
  const takenBy = new Map(B.med_log.map(m => [m.med_name, m.taken_at]));
  const isThu = new Date().getDay() === 4;
  const groups = {}; for (const m of B.medications.filter(m => m.active)) (groups[m.timing||"other"] ||= []).push(m);
  const order = ["on_waking","with_breakfast","pre_gym","bedtime","weekly","other"];
  const medsHtml = order.filter(k=>groups[k]).map(k => `<div class="k" style="margin-top:8px">${TIMING[k]||k}${k==="weekly"&&isThu?" · today":""}</div><div class="pills">${groups[k].map(m => { const t = takenBy.get(m.name); return `<button class="pill ${t?"on":""} ${k==="weekly"&&isThu?"thu":""}" data-med="${E(m.name)}" data-id="${m.id}">${E(m.name)}${m.dose?`<small>${E(m.dose)}</small>`:""}${t?`<small>${tstr(t)}</small>`:""}</button>`; }).join("")}</div>`).join("");
  const takenCount = B.medications.filter(m=>m.active && takenBy.has(m.name)).length;
  document.getElementById("meds").innerHTML = `<h3>Meds <span class="cnt">${takenCount} of ${B.medications.filter(m=>m.active).length}</span></h3>${medsHtml}`;
  document.querySelectorAll("#meds .pill").forEach(p => p.onclick = async () => {
    const name = p.dataset.med, on = p.classList.contains("on"); p.classList.toggle("on");
    try { await api(on?"med_untake":"med_take", { med_name: name, medication_id: p.dataset.id }); B.med_log = on ? B.med_log.filter(m=>m.med_name!==name) : [...B.med_log, {med_name:name, taken_at:new Date().toISOString()}]; renderToday(); renderNext(); } catch(e){ toast("Not saved: "+e.message); }
  });
  const done = new Set(B.completions.filter(c=>!c.skipped).map(c=>c.template_id));
  const active = B.routines.filter(r => !r.paused);
  const dow = ["sun","mon","tue","wed","thu","fri","sat"][new Date().getDay()];
  const todayRoutines = active.filter(r => r.cadence !== "weekly" || !r.days || !r.days.length || r.days.map(x=>String(x).toLowerCase().slice(0,3)).includes(dow));
  const doneCount = todayRoutines.filter(r=>done.has(r.id)).length;
  document.getElementById("today-cnt").textContent = `${doneCount} of ${todayRoutines.length}`;
  const html = BLOCKS.map(([name, anchors]) => {
    const rs = todayRoutines.filter(r => anchors.includes(r.anchor||"wake") || (!r.anchor && name==="Wake"));
    const others = name==="Close" ? todayRoutines.filter(r => r.anchor && !BLOCKS.some(([,a])=>a.includes(r.anchor))) : [];
    const list = rs.concat(others); if (!list.length) return "";
    const dc = list.filter(r=>done.has(r.id)).length;
    return `<div class="card"><h3>${name} <span class="cnt">${dc} of ${list.length}</span></h3>
      ${list.map(r => `<div class="row ${done.has(r.id)?"done":""}" data-id="${r.id}"><button class="tick" aria-label="done">✓</button><div class="t">${E(r.title)}<small>${E(ANCHOR_NAMES[r.anchor]||"")}${r.cadence&&r.cadence!=="daily"?` · ${E(r.cadence.replace("_"," "))}`:""}</small></div>${r.window_start?`<span class="time">${E(String(r.window_start).slice(0,5))}</span>`:""}<button class="more" aria-label="edit">…</button></div>
      <div class="why">${r.why?E(r.why)+"<br>":""}${r.rung_full?`<b>Full:</b> ${E(r.rung_full)}<br>`:""}${r.rung_reduced?`<b>Reduced:</b> ${E(r.rung_reduced)}<br>`:""}${r.rung_floor?`<b>Floor:</b> ${E(r.rung_floor)}<br>`:""}${r.first_physical_motion?`<b>First motion:</b> ${E(r.first_physical_motion)}`:""}${!(r.why||r.rung_full||r.first_physical_motion)?"No notes yet. Tap … to add a why.":""}</div>`).join("")}
      <div class="add"><input placeholder="Add a routine to ${name}" data-block="${name}"><button class="btn ghost">Add</button></div></div>`;
  }).join("");
  const paused = B.routines.filter(r=>r.paused);
  document.getElementById("routines").innerHTML = html + (paused.length ? `<div class="card"><div class="k">Paused</div>${paused.map(r=>`<div class="row" data-id="${r.id}"><div class="t" style="color:var(--dim)">${E(r.title)}</div><button class="more">…</button></div>`).join("")}</div>` : "");
  document.querySelectorAll("#routines .row").forEach(row => {
    const id = row.dataset.id; const r = B.routines.find(x=>x.id===id);
    const tick = row.querySelector(".tick"); if (tick) tick.onclick = async (ev) => { ev.stopPropagation(); const was = row.classList.contains("done"); row.classList.toggle("done"); try { await api(was?"unmark":"mark", { template_id: id }); B.completions = was ? B.completions.filter(c=>c.template_id!==id) : [...B.completions, {template_id:id, completed_at:new Date().toISOString(), skipped:false}]; renderToday(); renderNext(); } catch(e){ row.classList.toggle("done"); toast("Not saved: "+e.message); } };
    const t = row.querySelector(".t"); if (t) t.onclick = () => { row.classList.toggle("open"); FOCUS.label = r.title; renderFocus(); };
    row.querySelector(".more").onclick = () => editRoutine(r);
  });

    btn.onclick = go; inp.onkeydown = (e) => { if (e.key==="Enter") { e.preventDefault(); go(); } };
  });
}

// ---------- BODY: training, the cut, labs ----------

    const top = (w) => w.exercises.map(e => { const best = e.sets.reduce((b,s)=> (s.lb||0)*(1+(s.reps||0)/30) > (b.lb||0)*(1+(b.reps||0)/30) ? s : b, e.sets[0]||{}); return `<div class="lift">${E(e.name)}<span>${best&&best.lb?`${best.lb} lb × ${best.reps}`:best&&best.reps?`${best.reps} reps`:best&&best.sec?`${best.sec}s`:""} · ${e.sets.length} sets</span></div>`; }).join("");
    tr.innerHTML = `<h3>Training <span class="cnt">${week.length} in 7 days · Hevy</span></h3>
      <div class="two"><div class="stat"><b>${week.length}</b><span>sessions this week</span></div><div class="stat"><b>${fmt(week.reduce((a,w)=>a+sets(w),0))}</b><span>working sets</span></div><div class="stat"><b>${fmt(week.reduce((a,w)=>a+vol(w),0)/1000,1)}<small>k lb</small></b><span>volume moved</span></div><div class="stat"><b>${fmt(week.reduce((a,w)=>a+ (new Date(w.end)-new Date(w.start))/60000,0))}<small> min</small></b><span>under the bar</span></div></div>
      ${hv.slice(0,3).map(w=>`<div style="margin-top:12px"><b>${E(w.title)}</b> <span class="k">${dstr(String(w.start).slice(0,10))} · ${fmt((new Date(w.end)-new Date(w.start))/60000)} min</span>${top(w)}</div>`).join("")}
      ${B.movement?`<div class="k" style="margin-top:12px">Program</div><div class="empty">${E(B.movement.program_name||"")}${B.movement.current_program_week?` · week ${E(B.movement.current_program_week)}`:""}${B.movement.gym_location?` · ${E(B.movement.gym_location)}`:""}</div>`:""}`;
  } else {
    tr.innerHTML = `<h3>Training</h3><div class="empty">${hv&&hv.error==="no key" ? "Hevy is not connected to the face yet. One command on the Mac puts the key in the sealed config and this fills in." : "Hevy did not answer: "+E(hv&&hv.error)}</div>${B.movement?`<div class="k" style="margin-top:8px">Program</div><div class="empty">${E(B.movement.program_name||"")}${B.movement.current_program_week?` · week ${E(B.movement.current_program_week)}`:""}</div>`:""}`;
  }
  // the cut: targets vs actuals
  const fd = document.getElementById("food");
  const H = B.health; const full = H.filter(r=>r.date!==B.today && r.dietary_energy_kcal!=null);
  const y = full[full.length-1]; const c = B.cut;
  if (c){
    const wk = full.slice(-7);
    const stat = (label, val, target, unit, goodUnder) => { const pct = target? Math.min(100, val/target*100) : 0; return `<div class="stat"><b>${fmt(val)}<small> / ${fmt(target)} ${unit}</small></b><span>${label}</span><div class="bar thin"><i style="width:${pct.toFixed(0)}%"></i></div></div>`; };
    fd.innerHTML = `<h3>The cut <span class="cnt">${E(c.phase||"")}${c.start_date?` · since ${dstr(c.start_date)}`:""}</span></h3>
      ${y ? `<div class="k">${dstr(y.date)}, the last full day logged</div><div class="two">${stat("calories", y.dietary_energy_kcal, c.kcal_target, "kcal", true)}${stat("protein", y.protein_g, c.protein_g_target, "g", false)}${y.carbs_g!=null?stat("carbs", y.carbs_g, c.carb_g_target, "g", true):""}${y.fat_g!=null?stat("fat", y.fat_g, c.fat_g_floor, "g floor", false):""}</div>` : `<div class="empty">No food logged in the last 45 days. FeedAI logs flow in through Apple Health.</div>`}
      ${wk.length?`<div class="k" style="margin-top:10px">7-day average</div><div class="two"><div class="stat"><b>${fmt(avg(wk.map(x=>x.dietary_energy_kcal)))}<small> kcal</small></b><span>vs ${fmt(c.kcal_target)} target</span></div><div class="stat"><b>${fmt(avg(wk.map(x=>x.protein_g)))}<small> g</small></b><span>protein vs ${fmt(c.protein_g_target)}</span></div></div>`:""}
      <div class="k" style="margin-top:10px">Targets</div><div class="empty">${fmt(c.kcal_target)} kcal · ${fmt(c.protein_g_target)} g protein · fat floor ${fmt(c.fat_g_floor)} g · carbs ${fmt(c.carb_g_target)} g · water ${c.water_l_target} L · TDEE est. ${fmt(c.tdee_estimate)}${c.walk_kcal?` · the walk ${fmt(c.walk_kcal)} kcal`:""}</div>`;
  } else fd.innerHTML = `<h3>Food</h3><div class="empty">No active cut protocol in the tables.</div>`;
  // labs and BP
  const lb = document.getElementById("labs");
  const bp = B.bp[0];
  lb.innerHTML = `<h3>Labs and pressure <span class="cnt">${B.labs.length} on the panel</span></h3>
    <div class="two"><div class="stat"><b>${bp?`${bp.systolic}/${bp.diastolic}`:"–"}</b><span>${bp?`BP ${dstr(String(bp.measured_at).slice(0,10))}${bp.pulse?` · pulse ${bp.pulse}`:""}`:"no BP logged yet"}</span></div><div class="stat"><div class="add" style="margin:0"><input id="bp-s" type="number" inputmode="numeric" placeholder="sys" style="padding:6px 8px"><input id="bp-d" type="number" inputmode="numeric" placeholder="dia" style="padding:6px 8px"><button class="btn ghost" id="bp-btn" style="padding:6px 9px">Log</button></div></div></div>
    ${B.labs.map(l=>`<div class="lift">${E(l.name)}<span>${l.result?E(l.result)+" · ":""}${l.drawn_at?dstr(l.drawn_at):"not drawn"}${l.cadence?` · ${E(l.cadence)}`:""}</span></div>`).join("")}`;
  document.getElementById("bp-btn").onclick = async () => { const s=Number(document.getElementById("bp-s").value), d=Number(document.getElementById("bp-d").value); if(!s||!d) return; try { await api("bp", { systolic:s, diastolic:d }); B = await api("board"); renderBody(); toast("Logged."); } catch(e){ toast("Not saved: "+e.message); } };
}

// ---------- WORK ----------
const openBoxes = new Set();
function renderWork(){
  const items = B.items; const top = (bid) => items.filter(i => i.box_id===bid && !i.parent_item_id);
  const subs = (pid) => items.filter(i => i.parent_item_id===pid);
  const lin = Array.isArray(B.linear) ? B.linear : [];
  const openTotal = items.filter(i=>!i.done && i.kind!=="note" && !i.parent_item_id).length + lin.length;
  document.getElementById("work-cnt").textContent = `${openTotal} open`;
  // Linear
  const L = document.getElementById("linear");
  if (lin.length){
    const pr = {1:"P1",2:"P2",3:"P3",4:"P4",0:""};
    const sorted = [...lin].sort((a,b)=> (a.due?daysTo(a.due):999)-(b.due?daysTo(b.due):999) || (a.priority||5)-(b.priority||5));
    L.innerHTML = `<h3>Linear <span class="cnt">${lin.length} open</span></h3>${sorted.slice(0,12).map(i=>`<div class="row" data-id="${i.id}"><button class="tick">✓</button><div class="t">${E(i.title)}<small>${E(i.key)}${i.project?` · ${E(i.project)}`:""}${i.state?` · ${E(i.state)}`:""}${pr[i.priority]?` · ${pr[i.priority]}`:""}</small></div>${i.due?`<span class="due">${daysTo(i.due)<0?"late":daysTo(i.due)===0?"today":"in "+daysTo(i.due)+"d"}</span>`:""}<a class="act" href="${E(i.url)}" target="_blank" rel="noopener">open</a></div>`).join("")}${lin.length>12?`<div class="empty">${lin.length-12} more in Linear.</div>`:""}
      <div class="add"><input id="lin-add" placeholder="New Linear to-do"><button class="btn ghost" id="lin-btn">Add</button></div>`;
    L.querySelectorAll(".row .tick").forEach(t => t.onclick = async () => { const row=t.closest(".row"); const i = lin.find(x=>x.id===row.dataset.id); row.classList.add("done"); try { await api("linear_done", { id:i.id, key:i.key, title:i.title }); B.linear = lin.filter(x=>x.id!==i.id); renderWork(); renderNext(); toast("Done in Linear."); } catch(e){ row.classList.remove("done"); toast("Not saved: "+e.message); } });
    document.getElementById("lin-btn").onclick = async () => { const v=document.getElementById("lin-add").value.trim(); if(!v) return; try { await api("linear_add", { title:v }); B = await api("board"); renderWork(); toast("Added to Linear."); } catch(e){ toast("Not saved: "+e.message); } };
  } else L.innerHTML = `<h3>Linear</h3><div class="empty">${B.linear&&B.linear.error==="no key" ? "Linear is not connected to the face yet. One command on the Mac puts the key in the sealed config and your real to-dos appear here." : B.linear&&B.linear.error ? "Linear did not answer: "+E(B.linear.error) : "Nothing open."}</div>`;
  // boxes
  const boxesHtml = B.boxes.map(b => {
    const t = top(b.id); const tasks = t.filter(i=>i.kind!=="note"); const dn = tasks.filter(i=>i.done).length;
    const open = t.filter(i=>!i.done).concat(t.filter(i=>i.done));
    const row = (i) => `<div class="row ${i.done?"done":""}" data-id="${i.id}">${i.kind==="note"?`<span class="tick" style="border-style:dashed;opacity:.5"></span>`:`<button class="tick">✓</button>`}<div class="t">${E(i.text)}${i.detail?`<small>${E(i.detail).replace(/(https?:\/\/\S+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:var(--water)">open ↗</a>')}</small>`:""}${i.kind==="decision"&&i.options?`<small>${(i.options||[]).map(o=>E(typeof o==="string"?o:(o.label||o.text||o.title||JSON.stringify(o)))).join(" · ")}${i.choice?` → <b>${E(i.choice)}</b>`:""}</small>`:""}</div>${i.due?`<span class="due">${daysTo(i.due)<0?"late":daysTo(i.due)===0?"today":"in "+daysTo(i.due)+"d"}</span>`:""}${subs(i.id).length?`<span class="time">${subs(i.id).filter(s=>s.done).length}/${subs(i.id).length}</span>`:""}</div>${subs(i.id).length?`<div class="sub">${subs(i.id).map(s=>`<div class="row ${s.done?"done":""}" data-id="${s.id}"><button class="tick">✓</button><div class="t">${E(s.text)}</div></div>`).join("")}</div>`:""}`;
    return `<div class="card box ${openBoxes.has(b.id)?"":"collapsed"}" data-box="${b.id}"><div class="hd"><b>${E(b.title)}</b><span class="cnt">${dn} of ${tasks.length}${b.deadline?` · ${daysTo(b.deadline)<0?"past":daysTo(b.deadline)+"d"}`:""}</span></div>${b.why?`<div class="why">${E(b.why)}</div>`:""}
      <div class="items">${open.map(row).join("") || `<div class="empty">Nothing in here yet.</div>`}</div>
      <div class="add"><input placeholder="Add to ${E(b.title)}"><button class="btn ghost">Add</button></div></div>`;
  }).join("");
  document.getElementById("boxes").innerHTML = boxesHtml;
  document.querySelectorAll(".box").forEach(card => {
    const bid = card.dataset.box;
    card.querySelector(".hd").onclick = () => { openBoxes.has(bid)?openBoxes.delete(bid):openBoxes.add(bid); card.classList.toggle("collapsed"); };
    card.querySelectorAll(".row").forEach(row => { const id=row.dataset.id; const it = B.items.find(x=>x.id===id); if (!it) return;
      const tick = row.querySelector("button.tick"); if (tick) tick.onclick = async (ev) => { ev.stopPropagation(); const was=!!it.done; row.classList.toggle("done"); try { await api("sync", { ops:[{kind:"item_set", id, done:!was}] }, "desk-api"); it.done=!was; renderWork(); renderNext(); } catch(e){ row.classList.toggle("done"); toast("Not saved: "+e.message); } };
      row.querySelector(".t").onclick = (ev) => { ev.stopPropagation(); FOCUS.label = it.text; renderFocus(); toast("Focus: "+it.text, 1200); };
    });
    const a = card.querySelector(".add"); const inp=a.querySelector("input"), btn=a.querySelector("button");
    const go = async () => { const v=inp.value.trim(); if(!v) return; const id = crypto.randomUUID(); btn.disabled=true; try { await api("sync", { ops:[{kind:"item_add", id, box_id:bid, text:v, position: 999}] }, "desk-api"); inp.value=""; B = await api("board"); openBoxes.add(bid); renderWork(); } catch(e){ toast("Not saved: "+e.message); } btn.disabled=false; };
    btn.onclick = (ev)=>{ev.stopPropagation(); go();}; inp.onclick=(ev)=>ev.stopPropagation(); inp.onkeydown=(e)=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } };
  });
  document.getElementById("projects").innerHTML = B.projects.map(p => { const mv = B.moves.filter(m=>m.project_id===p.id); return `<div class="card"><div class="hd" style="display:flex;justify-content:space-between"><b>${E(p.title)}</b><span class="cnt" style="color:var(--gold);font-family:'IBM Plex Mono',monospace;font-size:.7rem">${mv.filter(m=>m.status==="done").length} of ${mv.length}${p.due_ymd?` · ${daysTo(p.due_ymd)}d`:""}</span></div><div class="k" style="margin-top:4px">From the platform, staged</div>${mv.map(m=>`<div class="row"><span class="time">${m.stage}</span><div class="t">${E(m.title)}<small>${E(m.why||"")}</small></div>${m.target_ymd?`<span class="due">${dstr(m.target_ymd)}</span>`:""}</div>`).join("")}</div>`; }).join("");
  // the search: opportunities and leads
  const S = document.getElementById("search");
  const opps = B.opportunities, leads = B.leads;
  S.innerHTML = `<h3>The search <span class="cnt">${opps.length} live · ${leads.length} leads</span></h3>
    ${opps.map(o=>`<div class="lead"><b>${E(o.notes? o.notes.split("\n")[0] : (o.source||o.pillar||"opportunity"))}</b><small>${E(o.stage||"")}${o.estimated_value_usd?` · $${fmt(o.estimated_value_usd)}`:""}${o.probability?` · ${Math.round(o.probability*100)}%`:""}${o.next_action?` · next: ${E(o.next_action)}`:""}${o.next_action_due?` (${dstr(o.next_action_due)})`:""}</small></div>`).join("") || `<div class="empty">No live opportunities.</div>`}
    ${leads.length?`<div class="k" style="margin-top:10px">Best-fit roles seen</div>`:""}
    ${leads.slice(0,6).map(l=>`<div class="lead"><b>${E(l.title)}</b><small>${E(l.company||"")}${l.comp_raw?` · ${E(l.comp_raw)}`:""} · <span class="fit">fit ${l.fit_score??"?"}${l.fit_bucket?` ${E(l.fit_bucket)}`:""}</span></small>${l.fit_rationale?`<small>${E(l.fit_rationale).slice(0,160)}</small>`:""}<div class="acts">${l.url?`<a href="${E(l.url)}" target="_blank" rel="noopener">open</a>`:""}<button data-id="${l.id}" data-s="pursuing">pursue</button><button data-id="${l.id}" data-s="dismissed">dismiss</button></div></div>`).join("")}`;
  S.querySelectorAll(".lead .acts button").forEach(b => b.onclick = async () => { try { await api("lead_set", { id:b.dataset.id, status:b.dataset.s }); B = await api("board"); renderWork(); } catch(e){ toast("Not saved: "+e.message); } });
}

// ---------- PEOPLE ----------
function renderPeople(){
  const P = B.people.filter(p => !(p.snoozed_until && daysTo(p.snoozed_until)>0));
  const due = (p) => { if (!p.last_contacted) return null; const cd = CAD_DAYS[p.cadence]; if (!cd) return null; return -daysTo(p.last_contacted) - cd; };
  const ranked = [...P].sort((a,b)=> (due(b)??-999) - (due(a)??-999));
  const thread = new Map(B.thread.map(t=>[t.person_id, t]));
  document.getElementById("people-cnt").textContent = `${P.length} kept warm`;
  document.getElementById("people-card").innerHTML = ranked.slice(0,14).map(p => { const o = due(p); const th = thread.get(p.id); return `<div class="who" data-id="${p.id}"><div class="n"><b>${E(p.name)}</b>${o!=null&&o>0?` <span class="late">${o}d over</span>`:""}<small>${[p.circle||p.category, p.cadence, p.last_contacted?`last ${dstr(p.last_contacted)}`:"never logged"].filter(Boolean).map(E).join(" · ")}${th&&th.next_move?`<br>next: ${E(th.next_move)}`:""}</small></div><button class="act" data-touch="${p.id}">Touched today</button></div>`; }).join("") + (P.length>14?`<div class="empty">${P.length-14} more, all kept.</div>`:"");
  document.querySelectorAll("[data-touch]").forEach(b => b.onclick = async () => { try { await api("person_touch", { id:b.dataset.touch }); B = await api("board"); renderPeople(); renderNext(); toast("Logged."); } catch(e){ toast("Not saved: "+e.message); } });
}

// ---------- DATES ----------
function renderDates(){
  const rows = [];
  for (const b of B.boxes) if (b.deadline) rows.push({ d:b.deadline, t:b.title, s:"box" });
  for (const p of B.projects) if (p.due_ymd) rows.push({ d:p.due_ymd, t:p.title, s:"project" });
  for (const m of B.moves) if (m.target_ymd && m.status!=="done") rows.push({ d:m.target_ymd, t:m.title, s:"move" });
  for (const i of B.items) if (i.due && !i.done) rows.push({ d:i.due, t:i.text, s:"item" });
  for (const g of B.goals) if (g.target_date && g.status==="active") rows.push({ d:g.target_date, t:g.goal, s:"goal" });
  if (Array.isArray(B.linear)) for (const i of B.linear) if (i.due) rows.push({ d:i.due, t:`${i.key} ${i.title}`, s:"Linear" });
  for (const o of B.opportunities) if (o.next_action_due) rows.push({ d:o.next_action_due, t:o.next_action||"next action", s:"search" });
  for (const c of B.content) rows.push({ d:c.scheduled_for, t:c.title, s:c.platform });
  rows.sort((a,b)=>a.d.localeCompare(b.d));
  const cal = B.calendar.length ? `<div class="k">Today's calendar</div><div class="cal">${B.calendar.map(c=>`<div class="row"><span class="time">${c.all_day?"all day":tstr(c.start_at)}</span><div class="t">${E(c.summary)}${c.location?`<small>${E(c.location)}</small>`:""}</div></div>`).join("")}</div>` : `<div class="k">Today's calendar</div><div class="empty">Nothing cached for today.</div>`;
  const sched = B.schedule.length ? `<div class="k" style="margin-top:12px">Fixed points</div>${B.schedule.map(s=>`<div class="row"><span class="time">${s.time_local?String(s.time_local).slice(0,5):""}</span><div class="t">${E(s.label)}<small>${(s.days_of_week||[]).join(", ")}${s.is_non_negotiable?" · non-negotiable":""}</small></div></div>`).join("")}` : "";
  const thu = `<div class="row"><span class="time">${new Date().getDay()===4?"today":"Thu"}</span><div class="t">Testosterone</div></div>`;
  document.getElementById("dates-card").innerHTML = cal + sched + `<div class="k" style="margin-top:12px">Ahead</div>` + thu + (rows.slice(0,30).map(r => `<div class="row"><span class="time">${dstr(r.d)}</span><div class="t">${E(r.t)}<small>${E(r.s)}${daysTo(r.d)<0?" · past":daysTo(r.d)===0?" · today":" · in "+daysTo(r.d)+" days"}</small></div></div>`).join("") || `<div class="empty">No dates set.</div>`);
}

// ---------- GOALS ----------

// ---------- SAY IT ----------
document.getElementById("say").onsubmit = async (e) => {
  e.preventDefault(); const inp = document.getElementById("say-in"); const v = inp.value.trim(); if (!v) return;
  const out = document.getElementById("plan-out"); out.innerHTML = `<div class="plan"><b>Working on it…</b>${E(v)}</div>`; inp.value=""; location.hash="#work";
  try {
    const r = await api("word", { text: v }); const d = r.did;
    out.innerHTML = `<div class="plan"><div class="k">${E(d.kind)}</div><b>${E(d.title)}</b>${d.why?`<div style="color:var(--dim)">${E(d.why)}</div>`:""}${d.issue?`<div><a href="${E(d.issue.url)}" target="_blank" rel="noopener" style="color:var(--water)">${E(d.issue.identifier)} in Linear ↗</a></div>`:""}${d.items?`<ul>${d.items.map(i=>`<li>${E(i.text)}${i.steps?` <span style="color:var(--dim)">· ${i.steps} steps</span>`:""}</li>`).join("")}</ul>`:""}${(d.questions||[]).length?`<div class="q">${d.questions.map(q=>"? "+E(q)).join("<br>")}</div>`:""}</div>`;
    B = await api("board"); if (d.box_id) openBoxes.add(d.box_id); render();
  } catch(err) { out.innerHTML = `<div class="plan"><b>Could not plan it.</b>${E(err.message)}</div>`; }
};
